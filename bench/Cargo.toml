[package]
name = "hegel-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "hegel-bench"
path = "src/main.rs"

[dependencies]
hegeltest = { path = "..", features = ["static-engine"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["use-libc"] }

[profile.release]
debug = true
