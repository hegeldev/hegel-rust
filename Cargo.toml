[workspace]
members = [".", "hegel-macros", "hegel-c"]

[workspace.lints.clippy]
too_many_arguments = "allow"

[package]
name = "hegeltest"
version = "0.41.0"
edition = "2024"
# if you bump this, also bump ci.yml, hegel-macros/Cargo.toml, and hegel-c/Cargo.toml
rust-version = "1.86"
exclude = [
  "/.agents",
  "/.claude",
  "/AGENTS.md",
  "/.github",
  "/nix",
  "/RELEASE-sample.md",
  # Test-only fixture binaries (see the [[bin]] targets below). Excluding the
  # sources makes `cargo package` strip the [[bin]] targets from the published
  # crate, so downstream builds and `cargo install` never see them.
  "/tests/fixtures",
]
license = "MIT"
readme = "README.md"
repository = "https://github.com/hegeldev/hegel-rust"
homepage = "http://hegel.dev"
description = "Property-based testing for Rust, built on Hypothesis"
# Ideally we would replace property-testing with property-based-testing,
# but crates.io enforces that keywords be less than 20 characters.
keywords = ["testing", "fuzzing", "property-testing"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[lib]
name = "hegel"

# By default, rustdoc does not build examples even with -Zrustdoc-scrape-examples,
# because doing so would pull in dev-dependencies. Enabling doc-scrape-examples
# for one example is enough to lift this restriction. See
# https://doc.rust-lang.org/cargo/reference/unstable.html#scrape-examples
[[example]]
name = "stack"
doc-scrape-examples = true

# Prebuilt fixture binaries for the end-to-end integration tests. Each is a
# tiny `fn main` (or `#[hegel::main]`) program whose real-process behaviour —
# CLI parsing, stderr layout, panic hooks, backtraces — the tests in `tests/`
# assert on by spawning the binary via `env!("CARGO_BIN_EXE_…")`. Declaring
# them as [[bin]] targets makes cargo build, cache, and (under cargo-llvm-cov)
# instrument them like any other target: there are no uniquely-named temp
# crates to compile at test time and no artifacts cargo doesn't own. The
# sources are excluded from the published package (see `exclude` above).
[[bin]]
name = "fixture_basic_main"
path = "tests/fixtures/basic_main.rs"

[[bin]]
name = "fixture_main_simple"
path = "tests/fixtures/main_simple.rs"

[[bin]]
name = "fixture_main_failing"
path = "tests/fixtures/main_failing.rs"

[[bin]]
name = "fixture_main_rewrite"
path = "tests/fixtures/main_rewrite.rs"

[[bin]]
name = "fixture_main_explicit"
path = "tests/fixtures/main_explicit.rs"

[[bin]]
name = "fixture_output_failing"
path = "tests/fixtures/output_failing.rs"

[[bin]]
name = "fixture_report_failing"
path = "tests/fixtures/report_failing.rs"

[[bin]]
name = "fixture_two_bugs"
path = "tests/fixtures/two_bugs.rs"

[[bin]]
name = "fixture_payload_failing"
path = "tests/fixtures/payload_failing.rs"

[[bin]]
name = "fixture_threaded_rejects"
path = "tests/fixtures/threaded_rejects.rs"

[dependencies]
parking_lot = "0.12"
hegeltest-macros = { version = "=0.41.0", path = "hegel-macros" }
# The native engine + C ABI ("libhegel"). hegeltest drives it through the
# C ABI (the hegel_* extern "C" functions), exactly like other language
# bindings. Optional: by default build.rs builds it as a shared library the
# frontend loads at runtime, and only the `static-engine` feature links this
# crate (lib name `hegel_c`) into the dependency graph.
hegeltest-c = { version = "=0.37.5", path = "hegel-c", default-features = false, optional = true }
serde_json = "1.0.61"
# optional feature dependencies
rand = { version = "0.10", optional = true }
# opting out of the clock, now, and wasmbind features.
# 0.4.41 is the minimum version that has WeekdaySet.
chrono = { version = "0.4.41", default-features = false, features = ["std"], optional = true }
# opting out of bundled tz features
jiff = { version = "0.2", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
regex = "1.0"
rand = "0.10"
tempfile = "3.0"
# The bundled tz database is deliberately kept out of the library dependency
# above; tests need one so TimeZone printing can cover IANA-named zones.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde_json = "1.0.61"
insta = "1.47.2"
ctor = "0.2"
# Note: tokio 1.39 is when tokio started having the required compatibility
# with other macros for #[hegel::test] to work with #[tokio::test]. See
# https://github.com/tokio-rs/tokio/pull/6497
tokio = { version = "1.39", features = ["macros", "rt"] }
# Compile-diagnostic UI tests (tests/test_ui.rs + tests/ui/*.rs): macro and
# derive misuse must fail to compile with the pinned .stderr output.
trybuild = "1.0.116"
# Compile-time !Send/!Sync assertions (test-case handles must not be able to
# cross threads) without pinning toolchain-dependent diagnostic text.
static_assertions = "1.1.0"

[features]
default = []
# Gates `extras::rand::randoms()`, which generates `rand::RngCore` impls.
rand = ["dep:rand"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
serde_json = []
# Enables the serde_json/raw_value feature. Enables generators for serde_json::value::RawValue.
serde_json_raw_value = ["serde_json", "serde_json/raw_value"]
# Links the engine into the binary as a normal Rust dependency instead of
# loading the libhegel shared library at runtime. Self-contained binaries, at
# the cost of exposing the engine's entire dependency tree to your build.
static-engine = ["dep:hegeltest-c"]

# Tune the dev/test profile for CI speed.
#
# `opt-level = 1`: the native engine is compute-heavy, and running it
# unoptimized makes the property-test suites dominate CI wall-clock — far
# worse on Windows. opt-level 1 recovers most of the speed at modest compile
# cost. Kept as a *whole-profile* setting (not per-package) specifically so
# the coverage build can override it back to 0 via `CARGO_PROFILE_DEV_OPT_LEVEL`:
# `cargo llvm-cov` needs unoptimized code for accurate line attribution
# (optimization inlines small functions and drops their coverage regions).
# See the `check-coverage` recipe in the justfile.
#
# `debug = "line-tables-only"`: the default dev profile emits full DWARF/PDB
# debuginfo, which dominates link time — especially on Windows, where
# `link.exe` is slow and the fat `.pdb` is the bottleneck. line-tables-only
# keeps file/line info for panic backtraces (which tests rely on) while
# dropping the heavy variable/type debuginfo.
#
# Both settings affect only the *main* build. Integration tests that spawn
# `cargo` subprocesses build standalone temp crates with their own profile;
# those are tuned separately via the `CARGO_PROFILE_*` env vars in
# `tests/common/project.rs`.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[package.metadata.docs.rs]
all-features = true
# -D warnings means "deny warnings", which actually means "turn warnings into errors". Have
# we mentioned naming things is hard?
rustdoc-args = ["--cfg", "docsrs", "-D", "warnings"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
