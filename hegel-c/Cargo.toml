[package]
name = "hegeltest-c"
version = "0.30.5"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "C shared library bindings for Hegel's native engine."
repository = "https://github.com/hegeldev/hegel-rust"
homepage = "http://hegel.dev"
readme = "README.md"

# The lib is named `hegel_c` (not `hegel`) so it can coexist in one
# dependency graph with the `hegeltest` crate, whose lib is named `hegel`:
# the upcoming inversion has `hegeltest` depend on this crate, and two
# crates sharing a lib name cannot. This only changes the build-output stem
# (`libhegel_c.{so,a}`); the C header (`hegel.h`), the exported `hegel_*`
# symbols, and the released `libhegel-<os>-<arch>` assets are unaffected.
[lib]
name = "hegel_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rand = { version = "0.10", default-features = false }
dashu-int = { version = "0.4.1", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
rustc-hash = { version = "2", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
libm = { version = "0.2", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["alloc", "fs", "time", "rand", "stdio", "process", "thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

[features]
default = ["std"]
# Link the Rust standard library into the built artifacts. The crate's own
# code is `#![no_std]` either way; this feature only makes std provide the
# global allocator, panic handling, and unwinding support that a final
# artifact (cdylib/staticlib) needs. Disable it together with enabling
# `runtime` to build a libhegel with no std runtime state at all.
std = []
# Provide the crate's own `#[global_allocator]` (the platform allocator) and
# `#[panic_handler]` (write the message to stderr, then abort) so the cdylib
# links without std. Only takes effect when `std` is disabled: builds that
# link std must use std's lang items, and defining a second set would fail
# to link. Build with `-C panic=abort` — without std there is no unwinder.
# `cargo test` cannot run under this configuration (integration-test
# harnesses link std and collide with these lang items, a duplicate
# `panic_impl` error); `just c-test-runtime` instead builds the runtime
# cdylib and runs the std-linked smoke suite against it via dlopen.
runtime = []
# Internal: exposes engine internals via `__bench` for hegeltest's benches/.
# Not part of the public C API; depend on at your peril.
__bench = []

[dev-dependencies]
# 0.29.2 is the minimum that reproduces the checked-in `include/hegel.h`
# byte-for-byte; earlier 0.29.x emit slightly different formatting, which the
# header drift test (correctly) rejects — surfacing under `-Z minimal-versions`.
cbindgen = "0.29.2"
libloading = "0.8"
tempfile = "3"
regex = "1.0"
serde_json = "1.0.61"
insta = "1.47.2"
ctor = "0.2"
